services:
   vprodb:
      build:
         context: ./Docker-files/db
      image: tcollins520/vprofiledb
      container_name: vprodb
      ports: 
         - "3307:3306"
      volumes:
         - vprodbdata:/var/lib/mysql
      environment:
         - MYSQL_ROOT_PASSWORD=bla
   vprocache01:
      image: memcached
      container_name: vprocache01
      ports: 
         - "11211:11211"  
   vpromq01:
      image: rabbitmq
      container_name: vpromq01
      ports: 
         - "5672:5672"  
      environment:
         - RABBITMQ_DEFAULT_USER=guest
         - RABBITMQ_DEFAULT_PASS=guest   
   vproapp:
      build:
         context: ./Docker-files/app
      image: tcollins520/vprofileapp:v3
      container_name: vproapp
      ports: 
         - "8080:8080"
      volumes:
         - vproappdata:/usr/local/tomcat/webapps 
   vproweb:
      build:
         context: ./Docker-files/web
      image: tcollins520/vprofileweb
      container_name: vproweb
      ports: 
         - "80:80"
      volumes:
         - vproappdata:/usr/local/tomcat/webapps 
volumes:
  #create host volumes
   vprodbdata: {}
   vproappdata: {}
